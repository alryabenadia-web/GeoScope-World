services:
  - type: web
    name: kids-world-explorer
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && cd backend && npm ci --include=dev && npm run build && npm run prisma:generate
    startCommand: cd backend && npm run prisma:migrate:deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kids-world-explorer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: kids-world-explorer-db
    plan: free
    databaseName: geography_learning
    user: geography_user
